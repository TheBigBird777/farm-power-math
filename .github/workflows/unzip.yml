name: Unzip site
on:
  push:
    paths:
      - '20-farm-power-math-site.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site files
        run: |
          unzip -o 20-farm-power-math-site.zip -d .
          rm 20-farm-power-math-site.zip
      - name: Commit extracted files
        run: |
          git config user.name "TheBigBird777"
          git config user.email "andy_friedrich@outlook.com"
          git add -A
          git status --short
          git commit -m "Add Farm Power Math site files" || echo "nothing to commit"
          git push
